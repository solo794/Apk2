name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main, master, claude/apk-mobile-app-conversion-hg930u]
    paths:
      - "www/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement:true lets this action create the Pages site itself (build type "workflow")
      # on the very first run — without it, configure-pages only reads the existing config and
      # fails outright when no Pages site exists yet at all.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # www/ is the entire app (same single-page app the Android build wraps) — served as-is,
      # no build step needed.
      - name: Upload web app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
