# بناء ملف AAB موقّع وجاهز للرفع على Google Play.
#
# محتاج 4 أسرار (Secrets) في المستودع قبل ما يشتغل:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   ANDROID_KEYSTORE_BASE64    ← مفتاحك (.jks) متحوّل base64:  base64 -w0 upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD  ← باسوورد المفتاح
#   ANDROID_KEY_ALIAS          ← الـalias (upload)
#   ANDROID_KEY_PASSWORD       ← باسوورد الـalias
#
# لو الأسرار مش متظبّطة، الووركفلو بيوقف برسالة واضحة بدل ما يطلّع ملف غير موقّع
# (ملف غير موقّع Play بترفضه على طول).
#
# بيبني نسخة "play" — اللي مفيهاش صلاحية قراءة الرسائل (شوف
# android/app/src/play/AndroidManifest.xml وقسم صلاحية الرسائل في PUBLISHING.md).
name: Build Play AAB (signed)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (سيبه فاضي عشان ياخد رقم التشغيل تلقائيًا — لازم يكون أعلى من أي رقم رفعته قبل كده)"
        required: false
        type: string
      version_name:
        description: "versionName اللي بيظهر للمستخدم (مثلاً 1.0)"
        required: false
        default: "1.0"
        type: string

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that the signing secrets exist
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KS_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KS_ALIAS_PASS" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::أسرار التوقيع الناقصة:$missing — راجع تعليمات الملف ده والمرحلة 2 في PUBLISHING.md"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # الأكشن افتراضيًا بيثبّت حزمة اسمها tools، وجوجل شالتها من مستودع الـSDK — فالخطوة
          # بتفشل قبل ما البناء يبدأ أصلاً. بنحدد اللي محتاجينه بالظبط بدل الافتراضي.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore the keystore from the secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          # لو السر اتلصق ناقص أو فيه أسطر زيادة، الملف بيطلع فاضي أو تالف — الأحسن نعرف
          # دلوقتي مش بعد ما البناء يخلص ويطلّع ملف غير موقّع
          SIZE=$(stat -c%s android/upload-keystore.jks)
          echo "حجم ملف المفتاح: $SIZE بايت"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::ملف المفتاح المستخرج صغير جدًا ($SIZE بايت) — غالبًا ANDROID_KEYSTORE_BASE64 اتلصق ناقص"
            exit 1
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # Play بترفض أي رفعة بـversionCode اتستخدم قبل كده، حتى لو الإصدار اللي استخدمه
      # اتلغى أو اتحذف. رقم تشغيل الووركفلو (run_number) بيزيد لوحده مع كل بناء، فهو
      # ضمان إن كل ملف طالع من هنا رقمه أعلى من اللي قبله من غير ما حد يفتكر يزوّده.
      - name: Work out the version code
        id: ver
        run: |
          VC="${{ inputs.version_code }}"
          if [ -z "$VC" ]; then VC="${{ github.run_number }}"; fi
          VN="${{ inputs.version_name }}"
          if [ -z "$VN" ]; then VN="1.0"; fi
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "### 📦 versionCode = \`$VC\` · versionName = \`$VN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "لو Play قالت إن الرقم ده مستخدم قبل كده، شغّل الووركفلو تاني وحُطّ رقم أعلى في خانة version_code." >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed AAB (play flavor)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundlePlayRelease --no-daemon \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.name }}

      - name: Confirm the bundle really is signed
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          ls -lh "$AAB"
          # ملف AAB موقّع لازم يكون جواه META-INF/*.RSA — ولو مش موجود يبقى الرفع هيترفض
          if unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "✅ الملف موقّع"
          else
            echo "::error::الملف مش موقّع — راجع أسرار التوقيع"
            exit 1
          fi

      - name: Confirm the SMS permission is not in the bundle
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          rm -rf /tmp/aabcheck && mkdir -p /tmp/aabcheck
          unzip -o -q "$AAB" 'base/manifest/AndroidManifest.xml' -d /tmp/aabcheck
          # المانفست جوه الـAAB بصيغة ثنائية، بس أسماء الصلاحيات بتفضل نصوص جواه — فوجود
          # السلسلة دي معناه إن نسخة الـfull (اللي بتقرا رسائل البنك) هي اللي اتبنت بالغلط.
          # ورفع نسخة فيها صلاحية رسائل من غير إقرار معتمد = مخالفة سياسة، مش مجرد رفض.
          if grep -aq 'android.permission.RECEIVE_SMS' /tmp/aabcheck/base/manifest/AndroidManifest.xml; then
            echo "::error::الـAAB فيه صلاحية RECEIVE_SMS — ده معناه إن النسخة المبنية مش نسخة المتجر"
            exit 1
          fi
          echo "✅ مفيش صلاحية رسائل في الملف"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f android/upload-keystore.jks

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: whatsleft-play-release-aab-v${{ steps.ver.outputs.code }}
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
