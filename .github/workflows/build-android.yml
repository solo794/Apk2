name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # The "full" flavor — everything, including bank-SMS reading. This is the build distributed
      # directly (outside the Play Store). Adding product flavors renamed the variants, so this is
      # assembleFullDebug now, not assembleDebug.
      - name: Build debug APK (full flavor)
        working-directory: android
        run: ./gradlew assembleFullDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masarifi-debug-apk
          path: android/app/build/outputs/apk/full/debug/app-full-debug.apk
