apply plugin: 'com.android.application'

android {
    namespace "com.salman.masarifi"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.salman.masarifi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Pinned to a debug.keystore checked into the repo (below) instead of Gradle's default
    // ~/.android/debug.keystore, which doesn't exist in a fresh CI runner and gets silently
    // auto-generated with a NEW random key on every single workflow run. Without this, every
    // debug APK built by GitHub Actions is signed differently, and Android refuses to install a
    // build over (or even alongside a half-finished install of) a previous one — "App not
    // installed" with no clearer reason. Pinning the key means every build, from CI or a local
    // machine, installs and updates cleanly.
    // Release signing comes from android/keystore.properties (local) or the matching env vars
    // (CI). Neither the keystore nor the passwords are ever committed — see
    // keystore.properties.example. When nothing is configured, the release build simply stays
    // unsigned instead of failing, so `assemble`/`bundle` still work for anyone cloning the repo.
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    def ksPath = keystoreProps['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
    def ksPass = keystoreProps['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def ksAlias = keystoreProps['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
    def ksAliasPass = keystoreProps['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
    def hasReleaseKey = ksPath && ksPass && ksAlias && ksAliasPass && file(ksPath).exists()

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKey) {
            release {
                storeFile file(ksPath)
                storePassword ksPass.toString()
                keyAlias ksAlias.toString()
                keyPassword ksAliasPass.toString()
            }
        }
    }

    // Two builds from one codebase, same applicationId (so Play treats them as the same app):
    //   full — everything, including reading bank SMS. This is the build distributed directly.
    //   play — identical except the RECEIVE_SMS permission and the SMS receiver are stripped from
    //          the manifest (see src/play/AndroidManifest.xml), because Play treats SMS access as
    //          a restricted permission and this app's use of it isn't one of the permitted core
    //          use cases. The app notices at runtime that the permission isn't declared and hides
    //          the feature itself (SmsReader.isSupported), so there is no second copy of any code.
    flavorDimensions += "distribution"
    productFlavors {
        full { dimension "distribution" }
        play { dimension "distribution" }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion" // NotificationCompat (SmsReceiver's bank-SMS alert)
    implementation "androidx.biometric:biometric:1.1.0" // BiometricAuthPlugin (app-lock)
    implementation "androidx.activity:activity:$androidxActivityVersion" // GoogleAuthPlugin's ActivityResult API
    implementation "com.google.android.gms:play-services-auth:21.2.0" // GoogleAuthPlugin (sign-in + Drive appdata token)
    implementation "com.android.billingclient:billing:7.1.1" // BillingPlugin (Pro subscription)
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
